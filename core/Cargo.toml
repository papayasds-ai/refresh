[package]
name = "refresh-core"
version = "0.1.0"
edition = "2021"
description = "Core secure transport and pairing protocol for Refresh"

[dependencies]
tokio = { version = "1", features = ["full"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
ed25519-dalek = { version = "2", features = ["rand_core", "serde", "pkcs8"] }
rand = "0.8"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
zeroize = { version = "1", features = ["derive"] }
hkdf = "0.12"
aes-gcm = "0.10"
directories = "5"

[dev-dependencies]
tokio-test = "0.4"
